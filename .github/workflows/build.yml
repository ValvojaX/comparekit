name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Runs the extension in a downloaded VS Code; it needs a display.
      - run: xvfb-run -a npm run test:integration

      - run: npm run package

      - name: Name the build
        id: name
        run: echo "vsix=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.vsix }}
          path: ${{ steps.name.outputs.vsix }}
          if-no-files-found: error
          retention-days: 30
